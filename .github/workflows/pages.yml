name: Deploy Storyline course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble course.zip and prepare site
        run: |
          set -euo pipefail
          mkdir -p _site
          cat chunks/course.b64.* | tr -d '\n' | base64 -d > course.zip
          unzip -o course.zip -d _site
          test -f _site/story.html
          if [ ! -f _site/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=story.html"><a href="story.html">Open course</a>' > _site/index.html
          fi
          touch _site/.nojekyll
          rm -f course.zip
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
      - name: Try configure GitHub Pages (Actions source)
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
