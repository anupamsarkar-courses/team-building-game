name: Deploy Storyline course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble course.zip and prepare site
        run: |
          set -euo pipefail
          mkdir -p _site
          cat chunks/course.b64.* | tr -d '\n' | base64 -d > course.zip
          unzip -o course.zip -d _site
          test -f _site/story.html
          if [ ! -f _site/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=story.html"><a href="story.html">Open course</a>' > _site/index.html
          fi
          touch _site/.nojekyll
          rm -f course.zip
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
